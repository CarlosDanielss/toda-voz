<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" fill="none">
  <defs>
    <!-- Gradiente em fundo claro -->
    <linearGradient id="tv-c1-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5844D4" />
      <stop offset="100%" stop-color="#0A6E88" />
    </linearGradient>
    <style>
      .label { font-family: 'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #15151D; font-size: 58px; letter-spacing: -0.02em; }
      .tagline { font-family: 'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #5844D4; font-size: 20px; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- Símbolo (Horizontal) -->
  <g transform="translate(40, 45)">
    <!-- Forma 1: Emissora acolhedora -->
    <path d="M40 10 C18 10 0 28 0 50 C0 85 30 115 75 115 C95 115 112 107 125 95 C115 82 108 65 108 50 C108 28 88 10 65 10 Z" fill="url(#tv-c1-light)" />
    <!-- Forma 2: Receptora / Resposta ativa -->
    <path d="M95 35 C82 48 75 66 75 85 C75 106 91 125 115 125 C145 125 160 100 160 75 C160 48 135 25 105 25 C101 25 98 28 95 35 Z" fill="url(#tv-c1-light)" opacity="0.92" />
    <circle cx="120" cy="40" r="14" fill="url(#tv-c1-light)" />
  </g>

  <!-- Tipografia -->
  <text x="240" y="115" class="label">Toda Voz</text>
  <text x="244" y="152" class="tagline">TODA VOZ IMPORTA</text>
</svg>