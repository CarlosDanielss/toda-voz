<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" fill="none" role="img" aria-labelledby="tv-h-escuro-titulo">
  <title id="tv-h-escuro-titulo">Toda Voz: toda voz importa</title>
  <defs>
    <linearGradient id="tv-h-escuro-grad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#B0A2FE" />
      <stop offset="100%" stop-color="#5ED9E6" />
    </linearGradient>
    <style>
      .nome { font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; font-weight: 700; fill: #F6F6F9; font-size: 58px; letter-spacing: -0.02em; }
      .slogan { font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; font-weight: 600; fill: #5ED9E6; font-size: 24px; }
    </style>
  </defs>

  <!-- Versão para fundos escuros, sem fundo próprio. -->
  <!-- Símbolo: ponto (olhar, intenção), haste (gesto, sinal) e arco (voz que se propaga) -->
  <g transform="translate(45, 45)">
    <circle cx="25" cy="75" r="18" fill="url(#tv-h-escuro-grad)" />
    <rect x="65" y="30" width="28" height="90" rx="14" fill="url(#tv-h-escuro-grad)" />
    <path d="M 115 20 C 145 35 155 115 115 130" stroke="url(#tv-h-escuro-grad)" stroke-width="26" stroke-linecap="round" />
  </g>

  <text x="240" y="115" class="nome">Toda Voz</text>
  <text x="242" y="155" class="slogan">Toda voz importa</text>
</svg>
